name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test-Compile with Maven
        working-directory: vocabulary-ai-backend
        run: mvn clean test-compile -B

      - name: Package Application (JAR)
        working-directory: vocabulary-ai-backend
        run: mvn package -DskipTests=true -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-run validation)
        uses: docker/build-push-action@v5
        with:
          context: ./vocabulary-ai-backend
          push: false
          tags: vocabulary-ai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: vocabulary-ai-backend/target/*.jar
          retention-days: 7
