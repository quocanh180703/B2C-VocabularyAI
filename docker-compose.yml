# ============================================================
# VocabularyAI - Root Docker Compose Configuration
# Chạy toàn bộ hệ thống: MySQL 8, Redis 7, Adminer, Backend & Frontend
# ============================================================
#
# Cách sử dụng nhanh:
#   1. Chạy tất cả (Full Stack):
#      docker compose up -d
#
#   2. Chỉ chạy Database & Redis (để code FE/BE local):
#      docker compose up -d mysql redis adminer
#
#   3. Dừng hệ thống:
#      docker compose down
#
#   4. Xem logs realtime:
#      docker compose logs -f
# ============================================================

services:
  # ------------------------------------------------------------
  # 1. MySQL 8 Database
  # ------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: vocabulary-ai-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-180703}
      MYSQL_DATABASE: datn_2
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./vocabulary-ai-backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-180703}"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - vocab-network

  # ------------------------------------------------------------
  # 2. Redis Cache
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vocabulary-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vocab-network

  # ------------------------------------------------------------
  # 3. Database Web Admin (Adminer) - Truy cập: http://localhost:8081
  # ------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: vocabulary-ai-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vocab-network

  # ------------------------------------------------------------
  # 4. Backend Spring Boot (Java 21) - Truy cập: http://localhost:8080
  # ------------------------------------------------------------
  backend:
    build:
      context: ./vocabulary-ai-backend
      dockerfile: Dockerfile
    container_name: vocabulary-ai-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: datn_2
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-180703}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vocab-network

  # ------------------------------------------------------------
  # 5. Frontend React SPA (Nginx) - Truy cập: http://localhost:3000
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./FE-Vocabulary-AI
      dockerfile: Dockerfile
    container_name: vocabulary-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vocab-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  vocab-network:
    driver: bridge
