# ============================================================
# VocabularyAI Backend - Application Configuration (Unified)
# ============================================================
# Single configuration file - no need for application-dev.yml or application-prod.yml

# ============================================================
# 1. Spring Configuration
# ============================================================
spring:
  application:
    name: vocabulary-ai-backend
  
  # ============================================================
  # 2. Database Configuration (MySQL)
  # ============================================================
  datasource:
    url: jdbc:mysql://localhost:3306/datn_2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:180703}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # ============================================================
  # 3. JPA/Hibernate Configuration
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # ============================================================
  # 3.5 Servlet Multipart Configuration
  # ============================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
  
  # ============================================================
  # 4. Flyway Database Migration
  # ============================================================
  flyway:
    enabled: true
    baselineOnMigrate: true
    baselineVersion: 0
    baselineDescription: "Initial baseline - all tables created in V1__comprehensive_schema.sql"
    locations: classpath:db/migration
    validateOnMigrate: true
    cleanDisabled: true
  
  # ============================================================
  # 5. Email Configuration (SMTP - Gmail)
  # ============================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:quocanh220219@gmail.com}
    password: ${MAIL_PASSWORD:jqbybpgwrydjzuzj}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  
  # ============================================================
  # 5.1 Thymeleaf Configuration
  # ============================================================
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  
  # ============================================================
  # 6. Cache Configuration
  # ============================================================
  cache:
    type: none
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 60000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

# ============================================================
# 7. Server Configuration
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-stacktrace: always
  compression:
    enabled: true
    min-response-size: 1024

# ============================================================
# 8. Logging Configuration
# ============================================================
logging:
  level:
    root: INFO
    com.vocabularyai: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/vocabulary-ai.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# ============================================================
# 9. Application-Specific Configuration
# ============================================================

# OTP Configuration
app:
  name: VocabularyAI
  
  debug:
    enabled: true  # Set to false in production
  
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  
  otp:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
  
  password-reset:
